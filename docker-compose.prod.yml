# 프로드 스택 — 인프라 + 앱(api/worker/front)까지 전부 컨테이너로.
# 개발용 docker-compose.yml(인프라만, 앱은 bootRun)과 달리 이 파일 하나로 완주한다.
#
#   기동:   docker compose -f docker-compose.prod.yml up -d --build
#   중지:   docker compose -f docker-compose.prod.yml down
#   초기화: docker compose -f docker-compose.prod.yml down -v
#
# 공개 포트: 80(콘솔+API), 3000(Grafana), 8088(Kafka UI) — 3000/8088 은 운영에서 방화벽/IP 제한 권장
# 시크릿은 .env 로 주입(.env.example 참고). 로컬 검증은 무설정으로 돈다.
#
# 실서버 SES 전환: SMTP_* 환경변수만 바꾸면 된다(.env) — mailhog 서비스는 지워도 무방.

name: mail-platform-prod

services:
  # 4GB 단일 노드라 서비스별 mem_limit 로 총량을 통제한다. JVM 의
  # -XX:MaxRAMPercentage 는 이 한도를 기준으로 힙을 잡으므로(한도가 없으면
  # 호스트 전체 4GB 를 제 몫으로 착각) 한도가 곧 OOM 방지선이다.
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 512m
    environment:
      POSTGRES_DB: maildb
      POSTGRES_USER: maildb
      POSTGRES_PASSWORD: ${DB_PASSWORD:-maildb}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maildb -d maildb"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    restart: unless-stopped
    mem_limit: 512m
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./monitoring/rabbitmq_enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:3.8.1
    restart: unless-stopped
    mem_limit: 768m
    environment:
      # 기본 힙 1G 는 4GB 노드에 과함 — 브로커 1대·토픽 1개 규모의 값으로 고정
      KAFKA_HEAP_OPTS: -Xmx512M -Xms256M
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      # 개발 compose 와의 유일한 차이: 앱이 컨테이너라 서비스명으로 광고한다
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      # broker-api-versions.sh 는 검사마다 JVM 을 새로 띄운다 — 2vCPU 노드에서
      # 배포 중 CPU 가 포화되면 멀쩡한 브로커가 연속 타임아웃으로 unhealthy 판정을
      # 받아 배포를 무산시켰다(OPS-LOG 2026-08-21 추가). 리스너 포트 TCP 응답으로 대체.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/9092' 2>/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 30s

  # Kafka 웹 콘솔 — 토픽·소비자 그룹·LAG (운영은 방화벽/IP 제한 권장)
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    restart: unless-stopped
    mem_limit: 384m
    ports:
      # 루프백 바인딩 — 외부 노출 금지, SSH 터널로만 접근 (방화벽과 이중 방어)
      - "127.0.0.1:8088:8080"
    environment:
      JAVA_OPTS: -Xmx256m
      KAFKA_CLUSTERS_0_NAME: mail-platform
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "false"
    depends_on:
      kafka:
        condition: service_healthy

  # SES 전환 전까지의 SMTP — 전환 후엔 SMTP_* 만 바꾸고 이 서비스는 제거해도 된다
  mailhog:
    image: mailhog/mailhog
    restart: unless-stopped
    mem_limit: 128m
    ports:
      - "127.0.0.1:8025:8025"   # 받은편지함 UI — SSH 터널로만 접근

  # image 는 CI(GitHub Actions)가 빌드해 ghcr 에 올리는 이름 — 서버는 pull 만 한다.
  # 로컬 검증은 여전히 --build 로 같은 이름을 직접 빌드하면 된다.
  api:
    image: ghcr.io/ahrimjang/mail-platform-api:latest
    build:
      context: .
      target: api
    restart: unless-stopped
    mem_limit: 768m
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/maildb
      DB_USERNAME: maildb
      DB_PASSWORD: ${DB_PASSWORD:-maildb}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SMTP_HOST: ${SMTP_HOST:-mailhog}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTH: ${SMTP_AUTH:-false}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost}
      APP_JWT_SECRET: ${APP_JWT_SECRET:-dev-only-not-a-real-secret-key-0123456789-abcdefghijklmnopqrstuvwxyz}
      APP_WEBHOOK_SECRET: ${APP_WEBHOOK_SECRET:-dev-webhook-secret}
      APP_WEBHOOK_SNS_VERIFY_SIGNATURE: ${APP_WEBHOOK_SNS_VERIFY_SIGNATURE:-true}
      # 시스템 메일 링크가 가리키는 콘솔 주소 — 운영은 APP_BASE_URL 과 같은 오리진
      APP_CONSOLE_URL: ${APP_CONSOLE_URL:-http://localhost}
      # 평판·정원 가드 (운영 값은 .env — .env.example 참고)
      APP_SENDER_DOMAIN: ${APP_SENDER_DOMAIN:-}
      APP_BETA_SIGNUP_CAP: ${APP_BETA_SIGNUP_CAP:-0}
      APP_MAIL_WARMUP_ENABLED: ${APP_MAIL_WARMUP_ENABLED:-true}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      # 기본값은 토스 문서의 공용 테스트 키(실결제 없음) — application.yml 과 동일
      TOSS_CLIENT_KEY: ${TOSS_CLIENT_KEY:-test_ck_docs_Ovk5rk1EwkEbP0W43n07xlzm}
      TOSS_SECRET_KEY: ${TOSS_SECRET_KEY:-test_sk_docs_OaPz8L5KdmQXkzRz3y47BMw6}
    volumes:
      - uploads-data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/api/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      # 2vCPU 버스트 노드에서 배포 직후(이미지 pull + JVM 2개 동시 기동)에는
      # 기동이 4분까지 늘어진 실측이 있다(OPS-LOG 2026-08-21) — 예산을 7분으로.
      retries: 24
      start_period: 60s

  worker:
    image: ghcr.io/ahrimjang/mail-platform-worker:latest
    build:
      context: .
      target: worker
    restart: unless-stopped
    mem_limit: 640m
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/maildb
      DB_USERNAME: maildb
      DB_PASSWORD: ${DB_PASSWORD:-maildb}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SMTP_HOST: ${SMTP_HOST:-mailhog}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTH: ${SMTP_AUTH:-false}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      kafka:
        condition: service_healthy
      # 스키마(Flyway)는 api 소유 — 워커는 validate 만 한다. healthy 대기 대신
      # started 로 두는 이유: api 헬스 판정이 늦어져도 워커가 볼모로 잡히지 않게.
      # 마이그레이션 전에 떠서 validate 에 실패하면 restart 정책이 재시도하므로
      # 스키마가 준비되는 즉시 자가 회복한다.
      api:
        condition: service_started

  front:
    image: ghcr.io/ahrimjang/mail-platform-front:latest
    build:
      context: ./frontend
      args:
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    restart: unless-stopped
    mem_limit: 128m
    ports:
      - "80:80"
      - "443:443"   # TLS 는 certs/ 에 tls.conf+인증서가 있을 때만 열린다 (nginx-tls.conf.example)
    volumes:
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      api:
        # healthy 가 아니라 started — api 가 늦게 떠도 정적 페이지(랜딩·약관)는
        # 살아 있어야 한다. api 준비 전의 /api 요청은 nginx 가 502 로 답할 뿐이고,
        # healthy 대기였다면 사이트 전체가 죽는다(OPS-LOG 2026-08-21 521 장애).
        condition: service_started

  prometheus:
    image: prom/prometheus:v2.53.0
    restart: unless-stopped
    mem_limit: 256m
    volumes:
      - ./monitoring/prometheus.prod.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:11.1.0
    restart: unless-stopped
    mem_limit: 256m
    ports:
      - "127.0.0.1:3000:3000"   # SSH 터널로만 접근 (방화벽과 이중 방어)
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  postgres-data:
  rabbitmq-data:
  kafka-data:
  uploads-data:
  grafana-data:
