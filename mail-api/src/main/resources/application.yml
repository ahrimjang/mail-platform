spring:
  application:
    name: mail-api
  mail:
    # Test sends ("내게 먼저 보내기") go out synchronously from the API — same
    # dev default (MailHog) and overrides as the worker's dispatch path.
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
  datasource:
    # Shared Postgres instance (docker compose) — mail-api/worker/admin all connect
    # to the same database as the state store. Defaults target local dev; override
    # via environment variables in production (see .env.example).
    url: ${DB_URL:jdbc:postgresql://localhost:5432/maildb}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:maildb}
    password: ${DB_PASSWORD:maildb}
  jpa:
    hibernate:
      ddl-auto: validate   # schema is owned by Flyway (infra: db/migration)
    open-in-view: false
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      # Engagement events (open/click/bounce) go out as JSON onto mail.events.
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  servlet:
    multipart:
      # Template image uploads (UploadService re-validates at 5MB).
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: 8080

# Prometheus scrape endpoint (/actuator/prometheus). The `application` tag keys
# every metric to its app so api/worker series don't collide in Grafana.
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      application: mail-api

app:
  jwt:
    # Dev-only fallback — production MUST set APP_JWT_SECRET (HS512 needs >= 64 bytes).
    secret: ${APP_JWT_SECRET:dev-only-not-a-real-secret-key-0123456789-abcdefghijklmnopqrstuvwxyz}
    expiration-minutes: ${APP_JWT_EXPIRATION_MINUTES:120}
  webhook:
    # Shared secret bounce providers must echo in X-Webhook-Token.
    secret: ${APP_WEBHOOK_SECRET:dev-webhook-secret}
    sns:
      # SES→SNS 서명 검증 (운영은 켠 채로 둘 것).
      verify-signature: ${APP_WEBHOOK_SNS_VERIFY_SIGNATURE:true}
      # 수용할 SNS TopicArn 허용목록(쉼표 구분). 비우면 무제한(개발 기본) —
      # 운영은 우리 바운스/컴플레인 토픽 ARN 을 반드시 지정(AUDIT SEC-2).
      topic-arn: ${APP_WEBHOOK_SNS_TOPIC_ARN:}
  uploads:
    # Local template-image storage; served publicly at /uploads/**.
    dir: ${APP_UPLOADS_DIR:uploads}
  # 재설정 메일 등 시스템 메일의 링크가 가리키는 콘솔 주소 —
  # 운영은 공개 도메인(APP_BASE_URL 과 동일 오리진), 개발 기본은 Vite.
  console-url: ${APP_CONSOLE_URL:http://localhost:5175}
  beta:
    # 베타 가입 정원 (워크스페이스 수 기준). 0/미설정 = 무제한 — 해제는 환경변수 제거.
    signup-cap: ${APP_BETA_SIGNUP_CAP:0}
  mail:
    # 발신 주소 허용 도메인. 미설정(개발 기본)이면 제한 없음 — MailHog 는 아무
    # 주소나 받는다. 운영은 SES 검증 도메인으로 반드시 설정(예: outpacemail.com),
    # 아니면 허용 밖 발신 주소가 발송 시점에 SES 554 로 대량 실패한다.
    sender-domain: ${APP_SENDER_DOMAIN:}
    # 신규 워크스페이스 워밍업 — 누적 발송 200통 미만이면 캠페인당 수신자 50명 상한.
    # 발송 평판 방어용이라 운영에서는 켠 채로 둘 것(끄면 첫 캠페인부터 대량 발송 가능).
    warmup-enabled: ${APP_MAIL_WARMUP_ENABLED:true}
  google:
    # 구글 로그인 (OAuth 클라이언트 ID). 미설정 시 구글 로그인 시도만 실패하고
    # 이메일+비밀번호 경로는 그대로 동작. 프론트는 VITE_GOOGLE_CLIENT_ID 로 같은 값.
    client-id: ${GOOGLE_CLIENT_ID:}
  toss:
    # 토스페이먼츠 빌링 — 기본값은 토스 문서의 공용 테스트 키(실결제 없음).
    # 운영 전 개발자센터에서 발급한 키로 교체. 시크릿 키는 서버 밖으로 절대 안 나감.
    client-key: ${TOSS_CLIENT_KEY:test_ck_docs_Ovk5rk1EwkEbP0W43n07xlzm}
    secret-key: ${TOSS_SECRET_KEY:test_sk_docs_OaPz8L5KdmQXkzRz3y47BMw6}

mail:
  sender:
    type: ${MAIL_SENDER_TYPE:smtp}
