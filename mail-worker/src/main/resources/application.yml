spring:
  application:
    name: mail-worker
  lifecycle:
    # 종료 시 각 단계가 마무리를 기다리는 한도(기본 30초). SMTP 최악 시간(연결 10 + 읽기 30 +
    # 쓰기 30 = 70초)보다 길어야 한다 — 짧으면 발송 도중 JVM 이 내려가고, 그 메시지는 SENDING
    # 에 남았다가 2분 뒤 다른 워커가 재클레임해 **이미 나간 메일을 한 번 더** 보낸다.
    timeout-per-shutdown-phase: ${SHUTDOWN_PHASE_TIMEOUT:80s}
  datasource:
    # Same shared Postgres instance as mail-api (see mail-api/application.yml).
    url: ${DB_URL:jdbc:postgresql://localhost:5432/maildb}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:maildb}
    password: ${DB_PASSWORD:maildb}
  jpa:
    hibernate:
      ddl-auto: validate   # schema is owned by Flyway (infra: db/migration)
    open-in-view: false
  mail:
    # Dev default is MailHog; production points at the real SMTP relay.
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:false}
          starttls:
            enable: ${SMTP_STARTTLS:false}
          # 타임아웃(ms). 이 합이 stale 재클레임 창(MailDispatchService, 2분)보다 확실히
          # 짧아야 한다 — 릴레이가 응답을 끌면 이쪽이 먼저 포기하므로, 다른 워커가 같은
          # 메시지를 재클레임해 두 번 보내는 일이 생기지 않는다(ARCH-4 중복 발송).
          connectiontimeout: ${SMTP_CONNECT_TIMEOUT_MS:10000}
          timeout: ${SMTP_READ_TIMEOUT_MS:30000}
          writetimeout: ${SMTP_WRITE_TIMEOUT_MS:30000}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        # One consumer processed a message at a time (default) — the send path is
        # I/O-bound (DB round-trips + SMTP), so run several in parallel per worker.
        concurrency: ${RABBITMQ_CONCURRENCY:8}
        max-concurrency: ${RABBITMQ_MAX_CONCURRENCY:16}
        prefetch: ${RABBITMQ_PREFETCH:10}
        # 종료 시 처리 중인 메시지를 기다리는 한도(기본 5초). 위 lifecycle 예산 안에서
        # SMTP 최악 시간을 덮어야 한다 — 여기서 끊기면 중복 발송으로 이어진다.
        shutdown-timeout: ${RABBITMQ_SHUTDOWN_TIMEOUT_MS:75000}
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 2000
          multiplier: 2.0
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      # BounceService (webhook path runs in api, but worker shares infra) publishes JSON too.
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      # Projection consumer: mail.events -> email_events read model.
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: io.github.ahrimjang.mail.common
        spring.json.value.default.type: io.github.ahrimjang.mail.common.EmailEventMessage

mail:
  sender:
    type: ${MAIL_SENDER_TYPE:smtp}

# The worker's only HTTP surface: /actuator/** for Prometheus scraping (it has
# no business endpoints — those live in mail-api on :8080).
server:
  port: ${WORKER_METRICS_PORT:8082}
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      application: mail-worker
    distribution:
      percentiles-histogram:
        # SMTP latency histogram buckets so Grafana can plot p95 with histogram_quantile.
        mail.smtp.send: true

app:
  # Public base URL baked into tracking/unsubscribe links — MUST be the externally
  # reachable address in production, or recipients' opens/clicks dead-end.
  base-url: ${APP_BASE_URL:http://localhost:8080}
  mail:
    # 발신 주소 없이 등록된 캠페인의 From — api 와 같은 값이어야 한다.
    # 비면 JavaMail 이 From 헤더를 넣지 않고 SES 가 거부한다.
    system-from: ${APP_MAIL_SYSTEM_FROM:no-reply@outpacemail.com}
  tracking:
    # 클릭 링크 서명키 — 워커가 서명하고 api 가 검증하므로 **두 프로세스가 같은 값**이어야
    # 한다(다르면 모든 클릭이 400). 운영 compose 가 양쪽에 동일 값을 주입한다.
    signing-key: ${APP_TRACKING_SIGNING_KEY:dev-only-not-a-real-secret-key-0123456789-abcdefghijklmnopqrstuvwxyz}
    # 물러난 서명키(쉼표 구분) — 워커는 서명만 하므로 실제로 쓰지 않지만, api 와 같은 설정을
    # 두어 양쪽 env 가 어긋나지 않게 한다(교체 때 한쪽만 바꾸는 사고 방지).
    previous-signing-keys: ${APP_TRACKING_PREVIOUS_SIGNING_KEYS:}
