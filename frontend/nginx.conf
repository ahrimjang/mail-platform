# 콘솔 + API 리버스 프록시. 라우팅 본문은 snippets/outpace.conf 로 묶었다.
#
# 인증 엔드포인트 속도 제한 존 — Cloudflare 뒤라서 접속 IP 는 CF 에지다.
# 진짜 클라이언트는 CF-Connecting-IP 헤더로 식별한다(직접 접속이면 빈 값 → 무제한
# 이지만 방화벽상 80/443 은 CF 를 거치는 게 정상 경로다).
limit_req_zone $http_cf_connecting_ip zone=authlimit:10m rate=2r/s;
#
# TLS(443)는 인증서와 함께 certs 볼륨에 든 tls.conf 가 연다(아래 include 가 줍는다) —
# 로컬처럼 certs 가 비어 있으면 80만 뜨므로 무설정 검증이 그대로 된다.
# 운영 구성은 nginx-tls.conf.example 참고.
server {
    listen 80;
    server_name _;
    include /etc/nginx/snippets/outpace.conf;
}

include /etc/nginx/certs/*.conf;
