# 콘솔 라우팅 공통부 — 80(로컬·개발)과 443(운영 TLS) 서버 블록이 함께 include 한다.
# 단일 오리진이라 메일 본문의 추적/수신거부 링크(APP_BASE_URL)도 같은 주소를 쓴다.

# 템플릿 이미지 업로드(5MB) 여유분
client_max_body_size 10m;

# 버전 노출 억제 + 기본 보안 헤더 (CSP 는 에디터 iframe/인라인 스타일 검토 후)
server_tokens off;
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options SAMEORIGIN always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Strict-Transport-Security "max-age=31536000" always;

root /usr/share/nginx/html;
index index.html;

# 가입·로그인·재설정은 IP당 속도 제한 — 크리덴셜 스터핑/가입 봇 완충.
# 계정 잠금(LoginAttemptGuard)은 앱 레벨에 따로 있고, 이건 물량 자체를 줄인다.
location /api/auth/ {
    limit_req zone=authlimit burst=10 nodelay;
    limit_req_status 429;
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# REST + 추적 픽셀/클릭 + 수신거부 + 웹훅 — 전부 /api 아래
location /api/ {
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# 업로드된 템플릿 이미지 (수신자 메일 클라이언트가 비인증으로 가져감)
location /uploads/ {
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
}

# SPA 라우팅 — 나머지는 전부 index.html 로
location / {
    try_files $uri /index.html;
}
